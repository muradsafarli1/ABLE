<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ABLE — Admin</title>
<link rel="stylesheet" href="/style.css">
<script src="/app.js"></script>
</head>
<body>
<div id="root"></div>
<script>
let state={type:'problems',editing:null};

document.addEventListener('DOMContentLoaded',async()=>{
  const u=await me();
  if(!u||u.role!=='admin'){location.href='/login.html';return;}
  document.getElementById('root').innerHTML=`
    <header class="top"><div class="wrap nav"><a class="brand" href="/">ABLE</a><div class="actions"><span style="color:#aeb7c8">${esc(u.name)}</span><a class="btn" href="/">View site</a><button class="btn" onclick="logout()">Log out</button></div></div></header>
    <main class="admin"><div class="wrap"><div class="admin-grid"><aside class="admin-side">
      <button class="active" data-type="problems">Problems</button><button data-type="articles">Articles</button><button data-type="contests">Contests</button><button data-type="exams">Exams</button><button data-type="users">Users</button>
    </aside><section class="admin-main" id="main"></section></div></div></main>`;
  document.querySelectorAll('.admin-side button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.admin-side button').forEach(x=>x.classList.remove('active'));b.classList.add('active');state.type=b.dataset.type;state.editing=null;render();});
  render();
});

async function render(){
  const m=document.getElementById('main');if(!m)return;
  if(state.type==='users'){
    try{const d=await api('/api/admin/users');m.innerHTML=`<div class="admin-head"><h2>Users</h2><span>${d.users.length} users</span></div><div class="bigcard"><div style="overflow-x:auto"><table class="table"><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Created</th></tr></thead><tbody>${d.users.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td>${esc(u.role)}</td><td>${u.createdAt?new Date(u.createdAt).toLocaleDateString():'—'}</td></tr>`).join('')}</tbody></table></div></div>`}catch(e){m.innerHTML=`<div class="bigcard"><h3>Could not load users</h3><p>${esc(e.message)}</p></div>`}return;
  }
  try{
    const d=state.type==='exams'?await api('/api/admin/exams'):await api('/api/content');
    const items=state.type==='exams'?d:d[state.type]||[];
    m.innerHTML=`<div class="admin-head"><div><h2>${state.type[0].toUpperCase()+state.type.slice(1)}</h2><span class="admin-count">${items.length} items</span></div><button class="btn primary" onclick="newItem()">+ New</button></div><div class="rows">${items.map(x=>`<div class="row"><div><h3>${esc(x.title)}</h3><p>${esc(x.description||x.excerpt||x.topic||'')}${state.type==='contests'?` · ${(x.problems||[]).length} problems`:''}${state.type==='exams'?` · ${(x.questions||[]).length} questions`:''}</p></div><div>${esc(x.status||'published')}</div><div class="right"><button class="btn" onclick="editItem('${esc(x.id)}')">Edit</button> <button class="btn" onclick="removeItem('${esc(x.id)}')">Delete</button></div></div>`).join('')||'<div class="empty">No items found.</div>'}</div>${state.editing?formHtml(state.editing):''}`;
  }catch(e){m.innerHTML=`<div class="bigcard"><h3>Could not load content</h3><p>${esc(e.message)}</p></div>`}
}

function esc(x=''){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function newItem(){
  if(state.type==='exams')state.editing={id:null,title:'',description:'',date:'',durationMinutes:60,status:'Upcoming',questions:[]};
  else if(state.type==='contests')state.editing={id:null,title:'',year:'',type:'Contest',description:'',status:'published',problems:[]};
  else if(state.type==='problems')state.editing={id:null,title:'',topic:'',difficulty:'',source:'',statement:'',solution:'',status:'published'};
  else state.editing={id:null,title:'',category:'',excerpt:'',body:'',status:'published'};
  render();
}
async function editItem(id){const d=state.type==='exams'?await api('/api/admin/exams'):await api('/api/content');state.editing=(state.type==='exams'?d:d[state.type]).find(x=>x.id===id);render();}

function formHtml(x){
  if(state.type==='exams')return `<div class="editor-card"><div class="tag">${x.id?'EDIT':'CREATE'} EXAM</div><div class="field"><label>Title</label><input class="input" id="f-title" value="${esc(x.title)}"></div><div class="formgrid"><div class="field"><label>Date / start time</label><input class="input" id="f-date" value="${esc(x.date||'')}" placeholder="2026-09-15 10:00"></div><div class="field"><label>Duration (minutes)</label><input class="input" id="f-durationMinutes" type="number" min="1" value="${Number(x.durationMinutes||60)}"></div><div class="field full"><label>Status</label><select class="select" id="f-status"><option ${x.status==='Upcoming'?'selected':''}>Upcoming</option><option ${x.status==='Open'?'selected':''}>Open</option><option ${x.status==='Finished'?'selected':''}>Finished</option></select></div></div><div class="field"><label>Description</label><textarea class="textarea" id="f-description" rows="3">${esc(x.description||'')}</textarea></div><div class="editor-section"><div class="editor-section-head"><div><h3>Questions</h3><p>Add every exam question here. LaTeX is supported.</p></div><button class="btn" onclick="addQuestion()">+ Add question</button></div><div id="question-editor">${questionEditor(x.questions||[],'exam')}</div></div><button class="btn primary" onclick="saveItem()">Save exam</button> <button class="btn" onclick="state.editing=null;render()">Cancel</button></div>`;

  if(state.type==='contests')return `<div class="editor-card"><div class="tag">${x.id?'EDIT':'CREATE'} CONTEST</div><div class="field"><label>Contest title</label><input class="input" id="f-title" value="${esc(x.title)}"></div><div class="formgrid"><div class="field"><label>Year</label><input class="input" id="f-year" value="${esc(x.year||'')}"></div><div class="field"><label>Type</label><input class="input" id="f-type" value="${esc(x.type||'Contest')}"></div><div class="field full"><label>Status</label><input class="input" id="f-status" value="${esc(x.status||'published')}"></div></div><div class="field"><label>Description</label><textarea class="textarea" id="f-description" rows="4">${esc(x.description||'')}</textarea></div><div class="editor-section"><div class="editor-section-head"><div><h3>Contest problems</h3><p>Use codes such as A1, A2, A3, N1, N2, N3. Full LaTeX is supported in the statement.</p></div><button class="btn" onclick="addContestProblem()">+ Add problem</button></div><div id="contest-problem-editor">${questionEditor(x.problems||[],'contest')}</div></div><button class="btn primary" onclick="saveItem()">Save contest</button> <button class="btn" onclick="state.editing=null;render()">Cancel</button></div>`;

  let fields='';
  if(state.type==='problems')fields=`<div class="field"><label>Title</label><input class="input" id="f-title" value="${esc(x.title)}"></div><div class="formgrid"><div class="field"><label>Topic</label><input class="input" id="f-topic" value="${esc(x.topic)}"></div><div class="field"><label>Difficulty</label><input class="input" id="f-difficulty" value="${esc(x.difficulty)}"></div><div class="field"><label>Source</label><input class="input" id="f-source" value="${esc(x.source)}"></div><div class="field"><label>Status</label><input class="input" id="f-status" value="${esc(x.status)}"></div></div><div class="field"><label>Problem Statement</label><textarea class="textarea" id="f-statement" rows="12">${esc(x.statement)}</textarea></div><div class="field"><label>Solution</label><textarea class="textarea" id="f-solution" rows="18">${esc(x.solution)}</textarea></div>`;
  if(state.type==='articles')fields=`<div class="field"><label>Title</label><input class="input" id="f-title" value="${esc(x.title)}"></div><div class="formgrid"><div class="field"><label>Category</label><input class="input" id="f-category" value="${esc(x.category)}"></div><div class="field"><label>Status</label><input class="input" id="f-status" value="${esc(x.status)}"></div></div><div class="field"><label>Excerpt</label><textarea class="textarea" id="f-excerpt" rows="3">${esc(x.excerpt)}</textarea></div><div class="field"><label>Body</label><textarea class="textarea" id="f-body" rows="16">${esc(x.body)}</textarea></div>`;
  return `<div class="editor-card"><div class="tag">${x.id?'EDIT':'CREATE'} ${state.type.slice(0,-1).toUpperCase()}</div>${fields}<button class="btn primary" onclick="saveItem()">Save</button> <button class="btn" onclick="state.editing=null;render()">Cancel</button></div>`;
}

function questionEditor(items,type){
  if(!items.length)return `<div class="empty editor-empty">No ${type==='contest'?'contest problems':'questions'} yet. Click “+ Add ${type==='contest'?'problem':'question'}”.</div>`;
  return items.map((q,i)=>`<div class="question-editor-row"><div class="question-editor-top"><strong>${type==='contest'?(esc(q.code||('A'+(i+1)))):'Question '+(i+1)}</strong><button class="btn danger" onclick="removeQuestion(${i},'${type}')">Remove</button></div>${type==='contest'?`<div class="field"><label>Problem code</label><input class="input q-code" data-index="${i}" value="${esc(q.code||'A'+(i+1))}" placeholder="A1"></div>`:''}<div class="field"><label>${type==='contest'?'Problem statement':'Question statement'}</label><textarea class="textarea q-statement" data-index="${i}" rows="9" placeholder="Write the full statement here. Use \\( ... \\) or $$ ... $$ for LaTeX.">${esc(q.statement||q.text||'')}</textarea></div>${type==='exam'?`<div class="field"><label>Optional solution / reference answer (not shown during exam)</label><textarea class="textarea q-solution" data-index="${i}" rows="5">${esc(q.solution||'')}</textarea></div>`:''}</div>`).join('');
}
function addQuestion(){state.editing.questions||=[];state.editing.questions.push({code:'',statement:'',solution:''});render();setTimeout(()=>document.getElementById('question-editor')?.lastElementChild?.scrollIntoView({behavior:'smooth'}),50)}
function addContestProblem(){state.editing.problems||=[];const n=state.editing.problems.length;state.editing.problems.push({code:'A'+(n+1),statement:'',solution:''});render();setTimeout(()=>document.getElementById('contest-problem-editor')?.lastElementChild?.scrollIntoView({behavior:'smooth'}),50)}
function removeQuestion(i,type){if(type==='contest')state.editing.problems.splice(i,1);else state.editing.questions.splice(i,1);render()}
function collectQuestions(type){const rows=[...document.querySelectorAll(type==='contest'?'.question-editor-row':'#question-editor .question-editor-row')];return rows.map((row,i)=>({...(type==='contest'?{code:(row.querySelector('.q-code')?.value||('A'+(i+1))).trim()}:{code:'Q'+(i+1)}),statement:row.querySelector('.q-statement')?.value||'',...(type==='contest'?{solution:''}:{solution:row.querySelector('.q-solution')?.value||''})}));}
async function saveItem(){const data={};document.querySelectorAll('[id^=f-]').forEach(e=>data[e.id.slice(2)]=e.value);if(state.type==='exams'){data.durationMinutes=Number(data.durationMinutes)||60;data.questions=collectQuestions('exam')}if(state.type==='contests'){data.problems=collectQuestions('contest')}try{const x=state.editing;if(x.id)await api(`/api/admin/${state.type}/${x.id}`,{method:'PUT',body:JSON.stringify(data)});else await api(`/api/admin/${state.type}`,{method:'POST',body:JSON.stringify(data)});state.editing=null;toast('Saved successfully');render()}catch(e){toast(e.message)}}
async function removeItem(id){if(!confirm('Delete this item?'))return;try{await api(`/api/admin/${state.type}/${id}`,{method:'DELETE'});toast('Deleted');render()}catch(e){toast(e.message)}}
</script>
</body>
</html>
