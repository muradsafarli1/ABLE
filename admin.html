<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ABLE — Admin</title><link rel="stylesheet" href="/style.css"><script defer src="/app.js"></script></head><body><div id="root"></div><script>
let state={type:'problems',editing:null};
document.addEventListener('DOMContentLoaded',async()=>{const u=await me();if(!u||u.role!=='admin'){location.href='/login.html';return;}document.getElementById('root').innerHTML=`<header class="top"><div class="wrap nav"><a class="brand" href="/">ABLE</a><div class="actions"><span style="color:#aeb7c8">${esc(u.name)}</span><a class="btn" href="/">View site</a><button class="btn" onclick="logout()">Log out</button></div></div></header><main class="admin"><div class="wrap"><div class="admin-grid"><aside class="admin-side"><button class="active" data-type="problems">Problems</button><button data-type="articles">Articles</button><button data-type="contests">Contests</button><button data-type="exams">Exams</button><button data-type="users">Users</button></aside><section class="admin-main" id="main"></section></div></div></main>`;document.querySelectorAll('.admin-side button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.admin-side button').forEach(x=>x.classList.remove('active'));b.classList.add('active');state.type=b.dataset.type;state.editing=null;render();});render();});
async function render(){const m=document.getElementById('main');if(!m)return;if(state.type==='users'){try{const d=await api('/api/admin/users');m.innerHTML=`<div class="admin-head"><h2>Users</h2><span>${d.users.length} users</span></div><div class="bigcard"><div style="overflow-x:auto"><table class="table"><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Created</th></tr></thead><tbody>${d.users.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td>${esc(u.role)}</td><td>${u.createdAt?new Date(u.createdAt).toLocaleDateString():'—'}</td></tr>`).join('')}</tbody></table></div></div>`;}catch(e){m.innerHTML=`<div class="bigcard"><h3>Could not load users</h3><p>${esc(e.message)}</p></div>`;}return;}try{const d=state.type==='exams'?await api('/api/admin/exams'):await api('/api/content');const items=state.type==='exams'?d:d[state.type]||[];m.innerHTML=`<div class="admin-head"><h2>${state.type[0].toUpperCase()+state.type.slice(1)}</h2><button class="btn primary" onclick="newItem()">+ New</button></div><div class="rows">${items.map(x=>`<div class="row"><div><h3>${esc(x.title)}</h3><p>${esc(x.description||x.excerpt||x.topic||'')}</p></div><div>${esc(x.status||'published')}</div><div class="right"><button class="btn" onclick="editItem('${esc(x.id)}')">Edit</button> <button class="btn" onclick="removeItem('${esc(x.id)}')">Delete</button></div></div>`).join('')||'<div class="empty">No items found.</div>'}</div>${state.editing?formHtml(state.editing):''}`;}catch(e){m.innerHTML=`<div class="bigcard"><h3>Could not load content</h3><p>${esc(e.message)}</p></div>`;}}
function esc(x=''){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function newItem(){state.editing=state.type==='exams'?{id:null,title:'',description:'',date:'',durationMinutes:60,status:'published',questions:[]}: {id:null,title:'',topic:'',difficulty:'',source:'',statement:'',solution:'',category:'',excerpt:'',body:'',year:'',type:'',description:'',status:'published'};render();}
async function editItem(id){const d=state.type==='exams'?await api('/api/admin/exams'):await api('/api/content');state.editing=(state.type==='exams'?d:d[state.type]).find(x=>x.id===id);render();}
function formHtml(x){if(state.type==='exams')return `<div class="bigcard" style="margin-top:25px"><div class="tag">${x.id?'EDIT':'CREATE'} EXAM</div><div class="field"><label>Title</label><input class="input" id="f-title" value="${esc(x.title)}"></div><div class="formgrid"><div class="field"><label>Date</label><input class="input" id="f-date" value="${esc(x.date||'')}"></div><div class="field"><label>Duration (minutes)</label><input class="input" id="f-durationMinutes" type="number" value="${esc(x.durationMinutes||60)}"></div><div class="field full"><label>Status</label><input class="input" id="f-status" value="${esc(x.status||'published')}"></div></div><div class="field"><label>Description</label><textarea class="textarea" id="f-description" rows="3">${esc(x.description||'')}</textarea></div><div class="field"><label>Questions JSON</label><textarea class="textarea" id="f-questions" rows="12" placeholder='[{"statement":"..."},{"statement":"..."}]'>${esc(JSON.stringify(x.questions||[],null,2))}</textarea></div><button class="btn primary" onclick="saveItem()">Save</button> <button class="btn" onclick="state.editing=null;render()">Cancel</button></div>`;let fields='';if(state.type==='problems')fields=`<div class="field"><label>Title</label><input class="input" id="f-title" value="${esc(x.title)}"></div><div class="formgrid"><div class="field"><label>Topic</label><input class="input" id="f-topic" value="${esc(x.topic)}"></div><div class="field"><label>Difficulty</label><input class="input" id="f-difficulty" value="${esc(x.difficulty)}"></div><div class="field"><label>Source</label><input class="input" id="f-source" value="${esc(x.source)}"></div><div class="field"><label>Status</label><input class="input" id="f-status" value="${esc(x.status)}"></div></div><div class="field"><label>Problem Statement</label><textarea class="textarea" id="f-statement" rows="10">${esc(x.statement)}</textarea></div><div class="field"><label>Solution</label><textarea class="textarea" id="f-solution" rows="15">${esc(x.solution)}</textarea></div>`;if(state.type==='articles')fields=`<div class="field"><label>Title</label><input class="input" id="f-title" value="${esc(x.title)}"></div><div class="formgrid"><div class="field"><label>Category</label><input class="input" id="f-category" value="${esc(x.category)}"></div><div class="field"><label>Status</label><input class="input" id="f-status" value="${esc(x.status)}"></div></div><div class="field"><label>Excerpt</label><textarea class="textarea" id="f-excerpt" rows="3">${esc(x.excerpt)}</textarea></div><div class="field"><label>Body</label><textarea class="textarea" id="f-body" rows="8">${esc(x.body)}</textarea></div>`;if(state.type==='contests')fields=`<div class="field"><label>Title</label><input class="input" id="f-title" value="${esc(x.title)}"></div><div class="formgrid"><div class="field"><label>Year</label><input class="input" id="f-year" value="${esc(x.year)}</div><div class="field"><label>Type</label><input class="input" id="f-type" value="${esc(x.type)}"></div><div class="field full"><label>Status</label><input class="input" id="f-status" value="${esc(x.status)}"></div></div><div class="field"><label>Description</label><textarea class="textarea" id="f-description" rows="5">${esc(x.description)}</textarea></div>`;return `<div class="bigcard" style="margin-top:25px"><div class="tag">${x.id?'EDIT':'CREATE'}</div>${fields}<button class="btn primary" onclick="saveItem()">Save</button> <button class="btn" onclick="state.editing=null;render()">Cancel</button></div>`;}
async function saveItem(){const data={};document.querySelectorAll('[id^=f-]').forEach(e=>data[e.id.slice(2)]=e.value);if(state.type==='exams'){try{data.durationMinutes=Number(data.durationMinutes)||60;data.questions=JSON.parse(data.questions||'[]');}catch{toast('Questions JSON is invalid');return;}}try{const x=state.editing;if(x.id)await api(`/api/admin/${state.type}/${x.id}`,{method:'PUT',body:JSON.stringify(data)});else await api(`/api/admin/${state.type}`,{method:'POST',body:JSON.stringify(data)});state.editing=null;toast('Saved');render();}catch(e){toast(e.message);}}
async function removeItem(id){if(!confirm('Delete this item?'))return;try{await api(`/api/admin/${state.type}/${id}`,{method:'DELETE'});toast('Deleted');render();}catch(e){toast(e.message);}}
</script></body></html>
