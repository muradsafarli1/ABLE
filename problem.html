<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ABLE — Problem</title><link rel="stylesheet" href="/style.css"><script src="/app.js"></script><script>window.MathJax={tex:{inlineMath:[['\\(','\\)'],['$','$']],displayMath:[['\\[','\\]'],['$$','$$']]},svg:{fontCache:'global'}};</script><script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script></head><body><script>
(async()=>{
 const id=new URLSearchParams(location.search).get('id');if(!id){location.href='/problems.html';return;}
 try{
  const d=await api('/api/content');const p=(d.problems||[]).find(x=>x.id===id);if(!p){location.href='/problems.html';return;}
  shell('Problems',p.title,`<main class="problem-page"><section class="pagehero"><div class="wrap" style="max-width:900px"><div class="eyebrow">${escapeHtml(p.topic||'Problem')}${p.difficulty?' · '+escapeHtml(p.difficulty):''}</div><h1>${escapeHtml(p.title)}</h1><p class="lead">Source: ${escapeHtml(p.source||'ABLE Archive')}</p></div></section><section class="section"><div class="wrap" style="max-width:900px"><article id="problem-content" class="problem-detail" style="font-size:19px;line-height:1.9;white-space:pre-wrap;color:var(--text)">${escapeHtml(p.statement||'The problem statement has not been added yet.')}</article>${p.solution?`<div class="solution-reveal"><button id="solution-btn" class="btn primary" onclick="showSolution()">Show solution</button></div><section id="solution-section" class="problem-solution solution-content"><div class="eyebrow">Solution:</div><div id="solution-content" style="font-size:19px;line-height:1.9;white-space:pre-wrap;color:var(--text)">${escapeHtml(p.solution)}</div></section>`:''}<div style="margin-top:55px"><a class="btn" href="/problems.html">← Back to Problems</a></div></div></section></main>`);
  window.showSolution=()=>{const s=document.getElementById('solution-section'),b=document.getElementById('solution-btn');if(!s)return;s.classList.add('open');if(b)b.style.display='none';renderMath();setTimeout(()=>s.scrollIntoView({behavior:'smooth',block:'start'}),80)};
  function renderMath(){if(window.MathJax?.typesetPromise)MathJax.typesetPromise([document.getElementById('problem-content'),document.getElementById('solution-content')]).catch(console.error);else setTimeout(renderMath,300)}renderMath();
 }catch(e){console.error('Problem loading error:',e);document.body.innerHTML=`<div class="error-page"><h1>Unable to load problem</h1><p>${escapeHtml(e.message)}</p><a href="/problems.html">← Back to Problems</a></div>`}
})();
</script></body></html>
