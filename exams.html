<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ABLE — Exams</title><link rel="stylesheet" href="/style.css"><script src="/app.js"></script></head><body><script>(async()=>{try{const u=await requireUser();if(!u)return;const d=await api('/api/exams');const cards=(d.exams||[]).map(e=>`<article class="exam-card"><div class="tag">${escapeHtml(e.status||'Upcoming')} · ${escapeHtml(e.duration||'')}</div><h2>${escapeHtml(e.title)}</h2><p>${escapeHtml(e.description||'')}</p><div class="exam-meta"><span>${escapeHtml(e.date||'')}</span><span>${e.questions?.length||0} questions</span></div><div style="margin-top:20px"><a class="btn primary" href="/exam.html?id=${encodeURIComponent(e.id)}">Open →</a></div></article>`).join('');shell('Exams','Exams',`<section class="pagehero"><div class="wrap"><div class="eyebrow">04 — Exams</div><h1>Test yourself.<br>Under pressure.</h1><p class="lead">Timed ABLE exams with automatic submission and saved results.</p></div></section><section class="section"><div class="wrap"><div class="cards">${cards||'<div class="empty">No exams available yet.</div>'}</div></div></section>`)}catch(e){console.error(e);document.body.innerHTML='<div style="padding:80px;text-align:center;color:white;font-family:sans-serif"><h1>Unable to load exams</h1><p>'+escapeHtml(e.message)+'</p><a href="/">← Back to ABLE</a></div>'}})();</script></body></html>
