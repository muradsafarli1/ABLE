<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ABLE — Exams</title>
<link rel="stylesheet" href="/style.css">
<script src="/app.js"></script>
</head>
<body>
<script>
(async()=>{
  try{
    const u=await requireUser();if(!u)return;
    const d=await api('/api/exams');
    const history=await api('/api/exams/history').catch(()=>({history:[]}));
    const completed=new Set((history.history||[]).map(h=>h.examId));
    const now=Date.now();
    const parseDate=e=>e.date?Date.parse(e.date.replace(' ','T')):NaN;
    const cards=(d.exams||[]).map(e=>{const date=parseDate(e);const past=completed.has(e.id)||e.status==='Finished'||(!Number.isNaN(date)&&date+e.durationMinutes*60000<now);return `<article class="exam-card"><div class="tag">${past?'Past':(e.status||'Upcoming')} · ${formatDuration(e.durationMinutes)}</div><h2>${escapeHtml(e.title)}</h2><p>${escapeHtml(e.description||'')}</p><div class="exam-meta"><span>${escapeHtml(e.date||'Date TBA')}</span><span>${e.questions?.length||0} questions</span></div><div class="exam-card-actions">${past?`<span class="exam-completed">Completed</span>`:`<button class="btn primary" onclick="registerAndOpen('${escapeHtml(e.id)}')">Register / Open →</button>`}</div></article>`}).join('');
    shell('Exams','Exams',`<section class="pagehero"><div class="wrap"><div class="eyebrow">04 — Exams</div><h1>Test yourself.<br>Under pressure.</h1><p class="lead">Register for timed ABLE exams. Your answers are saved when you finish, including automatic submission when the clock reaches zero.</p></div></section><section class="section"><div class="wrap"><div class="exam-grid">${cards||'<div class="empty">No exams available yet.</div>'}</div>${history.history?.length?`<div class="history-block"><div class="eyebrow">Your history</div><h2>Previous attempts</h2><div class="history-list">${history.history.map(h=>`<div class="history-row"><span>${escapeHtml(h.title)}</span><span>${new Date(h.submittedAt).toLocaleString()}</span></div>`).join('')}</div></div>`:''}</div></section>`);
  }catch(e){console.error(e);document.body.innerHTML=`<div class="error-page"><h1>Unable to load exams</h1><p>${escapeHtml(e.message)}</p><a href="/">← Back to ABLE</a></div>`}
})();
function formatDuration(m){m=Number(m||60);const h=Math.floor(m/60),mm=m%60;return h?`${h}h ${String(mm).padStart(2,'0')}m`:`${m}m`}
async function registerAndOpen(id){try{await api('/api/exams/'+encodeURIComponent(id)+'/register',{method:'POST'});location.href='/exam.html?id='+encodeURIComponent(id)}catch(e){toast(e.message)}}
</script>
</body>
</html>
