<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ABLE — Contest</title><link rel="stylesheet" href="/style.css"><script defer src="/app.js"></script></head><body><script>(async()=>{const id=new URLSearchParams(location.search).get('id');if(!id){location.href='/contests.html';return;}const d=await api('/api/content'),c=d.contests.find(x=>x.id===id);if(!c){location.href='/contests.html';return;}shell('Contests',c.title,`<section class="pagehero"><div class="wrap"><div class="eyebrow">${escapeHtml(c.type||'Contest')} · ${escapeHtml(c.year||'')}</div><h1>${escapeHtml(c.title)}</h1><p class="lead">${escapeHtml(c.description||'')}</p></div></section><section class="section"><div class="wrap"><div class="contest-paper">${(c.problems||[]).map((p,i)=>`<article class="contest-problem"><div class="tag">Problem ${i+1}</div><div class="question-text">${escapeHtml(p.statement||'')}</div><div class="tag" style="margin-top:24px">Solution:</div><div class="question-text">${escapeHtml(p.solution||'')}</div></article>`).join('')||'<p class="lead">Problems will be added soon.</p>'}</div></div></section>`);})();</script></body></html>
