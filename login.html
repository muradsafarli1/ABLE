<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ABLE — Login</title><link rel="stylesheet" href="/style.css"><script defer src="/app.js"></script></head><body><header class="top"><div class="wrap nav"><a class="brand" href="/">ABLE</a><a class="btn" href="/signup.html">Create account</a></div></header><main class="auth"><div class="authbox"><form id="form"><div class="eyebrow">ABLE Account</div><h1>Welcome back.</h1><p>Sign in to your ABLE account.</p><div class="field"><label>Email</label><input class="input" name="email" type="email" required autocomplete="email"></div><div class="field"><label>Password</label><input class="input" name="password" type="password" required autocomplete="current-password"></div><button class="submit">Log in</button><div class="notice" id="notice"></div><button type="button" id="show-change" class="btn" style="width:100%;margin-top:14px">Change password</button></form><form id="change-form" style="display:none;margin-top:26px;padding-top:24px;border-top:1px solid #2b2f37"><div class="eyebrow">Password</div><h2 style="font-family:'Space Grotesk';margin:0 0 8px">Change password</h2><p style="margin-top:0">Enter your email, current password and a new password.</p><div class="field"><label>Email</label><input class="input" name="email" type="email" required autocomplete="email"></div><div class="field"><label>Current password</label><input class="input" name="currentPassword" type="password" required autocomplete="current-password"></div><div class="field"><label>New password</label><input class="input" name="newPassword" type="password" minlength="8" required autocomplete="new-password"></div><button class="submit">Save new password</button><div class="notice" id="change-notice"></div><button type="button" id="back-login" class="btn" style="width:100%;margin-top:12px">Back to login</button></form></div></main><script>
const loginForm=document.getElementById('form'),changeForm=document.getElementById('change-form'),showChange=document.getElementById('show-change'),backLogin=document.getElementById('back-login');
showChange.onclick=()=>{loginForm.style.display='none';changeForm.style.display='block'};
backLogin.onclick=()=>{changeForm.style.display='none';loginForm.style.display='block'};
loginForm.onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),n=document.getElementById('notice');try{const d=await api('/api/login',{method:'POST',body:JSON.stringify(Object.fromEntries(f))});n.className='notice success';n.textContent='Logged in. Redirecting…';location.href=d.user.role==='admin'?'/admin.html':'/account.html'}catch(err){n.className='notice error';n.textContent=err.message;showChange.style.display='block'}};
changeForm.onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),n=document.getElementById('change-notice');try{await api('/api/change-password',{method:'POST',body:JSON.stringify(Object.fromEntries(f))});n.className='notice success';n.textContent='Password changed successfully. You can log in now.';setTimeout(()=>{changeForm.style.display='none';loginForm.style.display='block'},900)}catch(err){n.className='notice error';n.textContent=err.message}};
</script></body></html>
