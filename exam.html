<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ABLE — Exam</title>
<link rel="stylesheet" href="/style.css">
<!-- app.js MUST load before the inline exam script because the exam uses requireUser() and api(). -->
<script src="/app.js"></script>
</head>
<body>
<script>
(async()=>{
  const u=await requireUser();
  if(!u)return;

  const id=new URLSearchParams(location.search).get('id');
  if(!id){location.href='/exams.html';return;}

  try {
    const d=await api('/api/exams/'+encodeURIComponent(id));
    const e=d.exam;
    if(!e){location.href='/exams.html';return;}

    let answers={};
    let finished=false;
    let end=Date.now()+Number(e.durationMinutes||60)*60000;

    const enter=()=>{
      if(document.documentElement.requestFullscreen){
        document.documentElement.requestFullscreen().catch(()=>{});
      }
    };

    const finish=async()=>{
      if(finished)return;
      finished=true;
      try{
        await api('/api/exams/'+encodeURIComponent(id)+'/submit',{
          method:'POST',
          body:JSON.stringify({answers})
        });
      }catch(err){
        finished=false;
        toast(err.message);
        return;
      }

      document.body.innerHTML='<div class="exam-finished"><h1>Exam submitted.</h1><p>Your result has been saved automatically.</p><a class="btn primary" href="/exams.html">Back to Exams</a></div>';
      document.exitFullscreen?.().catch(()=>{});
    };

    const render=()=>{
      document.body.innerHTML=`<main class="exam-screen"><div class="exam-top"><strong>${escapeHtml(e.title)}</strong><span id="timer"></span><button class="btn primary" id="finish">Finish</button></div><div class="exam-questions">${(e.questions||[]).map((q,i)=>`<article class="exam-question"><div class="tag">Question ${i+1}</div><div class="question-text">${escapeHtml(q.statement||q.text||'')}</div><textarea class="textarea" data-i="${i}" placeholder="Your solution..."></textarea></article>`).join('')}</div></main>`;

      document.querySelectorAll('[data-i]').forEach(x=>{
        x.value=answers[x.dataset.i]||'';
        x.oninput=()=>answers[x.dataset.i]=x.value;
      });

      document.getElementById('finish').onclick=finish;
      enter();
    };

    render();

    const timer=setInterval(()=>{
      const left=Math.max(0,end-Date.now());
      const s=Math.ceil(left/1000);
      const el=document.getElementById('timer');
      if(el)el.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
      if(left<=0){clearInterval(timer);finish();}
    },250);

    document.addEventListener('fullscreenchange',()=>{
      if(!document.fullscreenElement&&!finished)enter();
    });
  } catch(err) {
    console.error('Exam loading error:',err);
    document.body.innerHTML=`<div style="padding:80px;text-align:center;color:white;font-family:sans-serif"><h1>Unable to load exam</h1><p>${escapeHtml(err.message)}</p><a href="/exams.html" style="color:#60a5fa">← Back to Exams</a></div>`;
  }
})();
</script>
</body>
</html>
