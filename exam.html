<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ABLE — Exam</title><link rel="stylesheet" href="/style.css"><script defer src="/app.js"></script></head><body><script>(async()=>{const u=await requireUser();if(!u)return;const id=new URLSearchParams(location.search).get('id');if(!id){location.href='/exams.html';return;}const d=await api('/api/exams/'+encodeURIComponent(id));const e=d.exam;if(!e){location.href='/exams.html';return;}let answers={};let finished=false;let end=Date.now()+Number(e.durationMinutes||60)*60000;const enter=()=>document.documentElement.requestFullscreen?.().catch(()=>{});const finish=async()=>{if(finished)return;finished=true;try{await api('/api/exams/'+encodeURIComponent(id)+'/submit',{method:'POST',body:JSON.stringify({answers})});}catch(err){toast(err.message);return;}document.body.innerHTML='<div class="exam-finished"><h1>Exam submitted.</h1><p>Your result has been saved automatically.</p><a class="btn primary" href="/exams.html">Back to Exams</a></div>';document.exitFullscreen?.().catch(()=>{});};const render=()=>{document.body.innerHTML='<main class="exam-screen"><div class="exam-top"><strong>'+escapeHtml(e.title)+'</strong><span id="timer"></span><button class="btn primary" id="finish">Finish</button></div><div class="exam-questions">'+(e.questions||[]).map((q,i)=>'<article class="exam-question"><div class="tag">Question '+(i+1)+'</div><div class="question-text">'+escapeHtml(q.statement||q.text||'')+'</div><textarea class="textarea" data-i="'+i+'" placeholder="Your solution..."></textarea></article>').join('')+'</div></main>';document.querySelectorAll('[data-i]').forEach(x=>{x.value=answers[x.dataset.i]||'';x.oninput=()=>answers[x.dataset.i]=x.value;});document.getElementById('finish').onclick=finish;enter();};render();const timer=setInterval(()=>{const left=Math.max(0,end-Date.now());const s=Math.ceil(left/1000);const el=document.getElementById('timer');if(el)el.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');if(left<=0){clearInterval(timer);finish();}},250);document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&!finished)enter();});})();</script></body></html>
