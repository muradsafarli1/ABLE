<!doctype html>
<html>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ABLE — Exam</title>
<link rel="stylesheet" href="/style.css">
<script src="/app.js"></script>
<script>window.MathJax={tex:{inlineMath:[['\\(','\\)'],['$','$']],displayMath:[['\\[','\\]'],['$$','$$']]},svg:{fontCache:'global'}};</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
</head>
<body>
<script>
(async()=>{
  const u=await requireUser();
  if(!u)return;
  const id=new URLSearchParams(location.search).get('id');
  if(!id){location.href='/exams.html';return;}
  try{
    const d=await api('/api/exams/'+encodeURIComponent(id));
    const e=d.exam;
    if(!e){location.href='/exams.html';return;}

    const storageKey='able_exam_'+id;
    const saved=JSON.parse(localStorage.getItem(storageKey)||'{}');
    let startedAt=saved.startedAt||new Date().toISOString();
    let finished=!!saved.submitted;
    const durationMs=Number(e.durationMinutes||60)*60000;
    let end=saved.end||Date.now()+durationMs;
    if(saved.submitted) end=saved.end||Date.now();
    let timer=null;

    const formatTime=ms=>{
      const total=Math.max(0,Math.ceil(ms/1000));
      const h=Math.floor(total/3600);
      const m=Math.floor((total%3600)/60);
      const s=total%60;
      return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    };

    const saveLocal=()=>localStorage.setItem(storageKey,JSON.stringify({startedAt,end,submitted:finished}));
    const enterFullscreen=()=>document.documentElement.requestFullscreen?.().catch(()=>{});

    const finish=async(reason='manual')=>{
      if(finished)return;
      finished=true;
      clearInterval(timer);
      saveLocal();
      try{
        await api('/api/exams/'+encodeURIComponent(id)+'/submit',{method:'POST',body:JSON.stringify({answers:{},startedAt,reason})});
        localStorage.setItem(storageKey,JSON.stringify({startedAt,end,submitted:true}));
        document.body.innerHTML=`<main class="exam-finished"><div><div class="eyebrow">EXAM SUBMITTED</div><h1>Submission saved.</h1><p>Your participation has been recorded.</p><button class="btn primary" onclick="window.print()">Print Exam</button> <a class="btn" href="/exams.html">Back to Exams</a></div></main>`;
        document.exitFullscreen?.().catch(()=>{});
      }catch(err){
        finished=false;
        toast(err.message);
      }
    };

    const render=()=>{
      document.body.innerHTML=`<main class="exam-screen"><header class="exam-top"><div><div class="exam-print-header">ABLE</div><div class="exam-label">EXAM</div><h1>${escapeHtml(e.title)}</h1></div><div class="exam-clock" id="timer">${formatTime(end-Date.now())}</div><div class="exam-actions"><button class="btn" id="pdf">Print Exam</button><button class="btn primary" id="finish">Finish</button></div></header><div class="exam-paper" id="exam-paper"><div class="exam-paper-title"><h2>${escapeHtml(e.title)}</h2><p>${escapeHtml(e.description||'')}</p></div>${(e.questions||[]).map((q,i)=>`<section class="exam-question"><div class="problem-number">Problem ${i+1}</div><div class="question-text">${escapeHtml(q.statement||q.text||'')}</div><div class="print-answer-space"></div></section>`).join('')}</div></main>`;
      document.getElementById('finish').onclick=()=>finish('manual');
      document.getElementById('pdf').onclick=()=>window.print();
      enterFullscreen();
      if(window.MathJax?.typesetPromise)MathJax.typesetPromise([document.getElementById('exam-paper')]).catch(console.error);
    };

    render();
    saveLocal();
    if(!finished){
      timer=setInterval(()=>{
        const left=end-Date.now();
        const el=document.getElementById('timer');
        if(el)el.textContent=formatTime(left);
        if(left<=0)finish('time');
      },250);
    }

    window.addEventListener('beforeunload',e=>{
      if(!finished){saveLocal();e.preventDefault();e.returnValue='';}
    });
    document.addEventListener('fullscreenchange',()=>{
      if(!document.fullscreenElement&&!finished){toast('Fullscreen is required for the exam.');setTimeout(enterFullscreen,250)}
    });
    document.addEventListener('visibilitychange',()=>{
      if(document.hidden&&!finished)toast('Please return to the exam. The timer continues running.');
    });
    document.addEventListener('contextmenu',e=>{if(!finished)e.preventDefault()});
  }catch(err){
    console.error('Exam loading error:',err);
    document.body.innerHTML=`<div class="error-page"><h1>Unable to load exam</h1><p>${escapeHtml(err.message)}</p><a href="/exams.html">← Back to Exams</a></div>`;
  }
})();
</script>
</body>
</html>
