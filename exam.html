<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ABLE — Exam</title>
<link rel="stylesheet" href="/style.css">
<script src="/app.js"></script>
<script>
window.MathJax={tex:{inlineMath:[['\\(','\\)'],['$','$']],displayMath:[['\\[','\\]'],['$$','$$']]},svg:{fontCache:'global'}};
</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
<style>
.exam-post{min-height:100vh;display:grid;place-items:center;padding:40px 20px;background:var(--bg,#0b0d10)}
.exam-post-card{width:min(760px,100%);padding:48px;border:1px solid rgba(255,255,255,.12);border-radius:22px;background:rgba(20,23,28,.96);text-align:center}
.exam-post-card h1{margin:10px 0 14px;font-size:clamp(32px,5vw,52px)}
.exam-post-card p{color:#aeb7c8;line-height:1.7}
.post-clock{font-size:34px;font-weight:700;letter-spacing:2px;margin:28px 0}
.post-clock.expired{color:#8f98a8}
.exam-link{display:block;margin:28px 0;padding:24px;border:1px solid rgba(255,255,255,.14);border-radius:16px;text-decoration:none;font-weight:700;font-size:18px}
.exam-review{min-height:100vh;background:var(--bg,#0b0d10);padding:50px 20px}
.exam-review-inner{width:min(900px,100%);margin:auto}
.exam-review h1{font-size:clamp(32px,5vw,52px);margin:10px 0}
.review-question{padding:28px 0;border-bottom:1px solid rgba(255,255,255,.1)}
.review-number{font-weight:700;margin-bottom:12px;color:#9aa7bb}
.review-text{font-size:18px;line-height:1.85}
@media(max-width:700px){.exam-post-card{padding:32px 22px}.exam-review{padding:32px 18px}}
</style>
</head>
<body>
<script>
(async()=>{
  const u=await requireUser();
  if(!u)return;

  const id=new URLSearchParams(location.search).get('id');
  if(!id){location.href='/exams.html';return;}

  const escape=window.escapeHtml||((x='')=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])));

  try{
    const d=await api('/api/exams/'+encodeURIComponent(id));
    const e=d.exam;
    if(!e){location.href='/exams.html';return;}

    const historyData=await api('/api/exams/history').catch(()=>({history:[]}));
    const previous=(historyData.history||[]).find(x=>x.examId===id);
    const storageKey='able_exam_'+id;
    const saved=JSON.parse(localStorage.getItem(storageKey)||'{}');
    const durationMs=Number(e.durationMinutes||60)*60000;
    let startedAt=saved.startedAt||null;
    let end=saved.end||null;
    let finished=!!previous||!!saved.submitted;
    let timer=null;

    const formatTime=ms=>{
      const total=Math.max(0,Math.ceil(ms/1000));
      const h=Math.floor(total/3600);
      const m=Math.floor((total%3600)/60);
      const s=total%60;
      return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    };

    const saveLocal=extra=>localStorage.setItem(storageKey,JSON.stringify({startedAt,end,submitted:finished,...extra}));

    function typeset(root){
      if(window.MathJax?.typesetPromise) MathJax.typesetPromise([root]).catch(console.error);
    }

    function renderReview(){
      document.body.innerHTML=`<main class="exam-review"><div class="exam-review-inner">
        <div class="eyebrow">COMPLETED EXAM</div>
        <h1>${escape(e.title)}</h1>
        <p class="lead">You have already completed this exam. You can return here at any time to review the questions. The exam timer will not restart.</p>
        <div class="bigcard" style="margin:30px 0">
          <div class="tag">SUBMITTED</div>
          <p>Submitted ${previous?.submittedAt?new Date(previous.submittedAt).toLocaleString():''}</p>
        </div>
        ${(e.questions||[]).map((q,i)=>`<section class="review-question"><div class="review-number">Problem ${i+1}${q.code?' · '+escape(q.code):''}</div><div class="review-text">${escape(q.statement||q.text||'')}</div></section>`).join('')}
        <div style="margin-top:38px"><a class="btn" href="/exams.html">← Back to Exams</a> <button class="btn primary" onclick="window.print()">Print Exam</button></div>
      </div></main>`;
      typeset(document.querySelector('.exam-review-inner'));
    }

    function renderUpload(uploadEnd){
      clearInterval(timer);
      const update=()=>{
        const left=Math.max(0,uploadEnd-Date.now());
        const el=document.getElementById('post-clock');
        if(el){el.textContent=formatTime(left);if(left<=0)el.classList.add('expired');}
      };
      document.body.innerHTML=`<main class="exam-post"><div class="exam-post-card">
        <div class="eyebrow">EXAM FINISHED</div>
        <h1>Submission saved.</h1>
        <p>Your exam has been recorded. You now have <strong>15 minutes</strong> to upload your handwritten solutions using the link below. You may leave this page during this 15-minute period.</p>
        <div class="post-clock" id="post-clock">${formatTime(uploadEnd-Date.now())}</div>
        ${e.submissionUrl?`<a class="exam-link" href="${escape(e.submissionUrl)}" target="_blank" rel="noopener">Open solution submission link ↗</a>`:`<div class="bigcard" style="margin:25px 0"><p>The organizer has not added a submission link yet.</p></div>`}
        <p id="upload-note">When the 15-minute window ends, this page will remain available, but the submission window will be closed.</p>
        <div style="margin-top:28px"><a class="btn" href="/exams.html">Back to Exams</a> <button class="btn primary" onclick="window.print()">Print Exam</button></div>
      </div></main>`;
      update();
      timer=setInterval(update,250);
    }

    if(finished){
      const submittedAt=previous?.submittedAt?new Date(previous.submittedAt).getTime():Date.now();
      const uploadEnd=saved.uploadEnd||submittedAt+15*60*1000;
      saveLocal({uploadEnd,submitted:true});
      renderReview();
      return;
    }

    startedAt=saved.startedAt||new Date().toISOString();
    end=saved.end||Date.now()+durationMs;
    saveLocal({startedAt,end,submitted:false});

    const enterFullscreen=async()=>{
      try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();}
      catch{}
    };

    const finish=async(reason='manual')=>{
      if(finished)return;
      finished=true;
      clearInterval(timer);
      try{
        await api('/api/exams/'+encodeURIComponent(id)+'/submit',{
          method:'POST',
          body:JSON.stringify({answers:{},startedAt,reason})
        });
        const uploadEnd=Date.now()+15*60*1000;
        saveLocal({submitted:true,uploadEnd});
        document.exitFullscreen?.().catch(()=>{});
        renderUpload(uploadEnd);
      }catch(err){
        finished=false;
        toast(err.message);
      }
    };

    document.body.innerHTML=`<main class="exam-screen"><header class="exam-top"><div><div class="exam-print-header">ABLE</div><div class="exam-label">EXAM</div><h1>${escape(e.title)}</h1></div><div class="exam-clock" id="timer">${formatTime(end-Date.now())}</div><div class="exam-actions"><button class="btn" id="pdf">Print Exam</button><button class="btn primary" id="finish">Finish</button></div></header><div class="exam-paper" id="exam-paper"><div class="exam-paper-title"><h2>${escape(e.title)}</h2><p>${escape(e.description||'')}</p></div>${(e.questions||[]).map((q,i)=>`<section class="exam-question"><div class="problem-number">Problem ${i+1}${q.code?' · '+escape(q.code):''}</div><div class="question-text">${escape(q.statement||q.text||'')}</div><div class="print-answer-space"></div></section>`).join('')}</div></main>`;

    document.getElementById('finish').onclick=()=>finish('manual');
    document.getElementById('pdf').onclick=()=>window.print();
    typeset(document.getElementById('exam-paper'));
    await enterFullscreen();

    timer=setInterval(()=>{
      const left=end-Date.now();
      const el=document.getElementById('timer');
      if(el)el.textContent=formatTime(left);
      if(left<=0)finish('time');
    },250);

    window.addEventListener('beforeunload',ev=>{
      if(!finished){saveLocal();ev.preventDefault();ev.returnValue='';}
    });

    document.addEventListener('fullscreenchange',()=>{
      if(!document.fullscreenElement&&!finished){
        toast('Fullscreen is required for the exam.');
        setTimeout(enterFullscreen,250);
      }
    });

    document.addEventListener('visibilitychange',()=>{
      if(document.hidden&&!finished)toast('Please return to the exam. The timer continues running.');
    });

    document.addEventListener('contextmenu',ev=>{if(!finished)ev.preventDefault()});

  }catch(err){
    console.error('Exam loading error:',err);
    document.body.innerHTML=`<div class="error-page"><h1>Unable to load exam</h1><p>${escape(err.message)}</p><a href="/exams.html">← Back to Exams</a></div>`;
  }
})();
</script>
</body>
</html>
