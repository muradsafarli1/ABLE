<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ABLE — Problems</title><link rel="stylesheet" href="/style.css"><script src="/app.js"></script></head><body><script>
(async()=>{try{const d=await api('/api/content');const all=(d.problems||[]).map(p=>p.topic==='Functional Equations'?{...p,topic:'Algebra'}:p);function card(p){return `<article class="card"><div class="tag">${escapeHtml(p.topic||'Problem')} · ${escapeHtml(p.difficulty||'')}</div><h3>${escapeHtml(localized(p,'title'))}</h3><p>Source: ${escapeHtml(p.source||'ABLE Archive')}</p><div class="meta"><span>${escapeHtml(p.status||'published')}</span><a href="/problem.html?id=${encodeURIComponent(p.id)}" style="color:inherit;text-decoration:none;cursor:pointer">Read →</a></div></article>`}function render(){shell('Problems','Problems',`<section class="pagehero"><div class="wrap"><div class="eyebrow">01 — Problems</div><h1>Problems worth<br>struggling with.</h1><p class="lead">A clean, growing archive of olympiad problems. No productivity noise — just the problem, the idea and the solution.</p></div></section><section class="section"><div class="wrap"><div class="toolbar"><input class="input" id="search" placeholder="Search problems..."><select class="select" id="topic"><option>All topics</option><option>Algebra</option><option>Geometry</option><option>Number Theory</option><option>Combinatorics</option></select></div><div class="cards" id="cards">${all.map(card).join('')}</div></div></section>`);document.getElementById('search').oninput=filter;document.getElementById('topic').onchange=filter;function filter(){const q=document.getElementById('search').value.toLowerCase(),t=document.getElementById('topic').value,filtered=all.filter(p=>(!q||localized(p,'title').toLowerCase().includes(q))&&(t==='All topics'||p.topic===t));document.getElementById('cards').innerHTML=filtered.map(card).join('')||'<div class="empty">No problems found.</div>')}}render()}catch(e){console.error(e);document.body.innerHTML=`<div class="error-page"><h1>Unable to load problems</h1><p>${escapeHtml(e.message)}</p><a href="/">← Back to ABLE</a></div>`}})();
</script></body></html>
