services:
  - type: web
    name: ABLE
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ABLE-Database
          property: connectionString

databases:
  - name: ABLE-Database
    plan: free
    region: ohio
    version: 18
